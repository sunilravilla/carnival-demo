<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" width="260" height="72">
  <!-- White-on-transparent Virgin Voyages wordmark for use on dark surfaces.
       Matches the official VIRGIN / VOYAGES stacked layout proportions. -->
  <text x="130" y="34"
        font-family="'Inter','Plus Jakarta Sans',Helvetica,sans-serif"
        font-size="30" font-weight="900"
        fill="#FFFFFF" text-anchor="middle"
        letter-spacing="0.5">VIRGIN</text>
  <text x="130" y="60"
        font-family="'Inter','Plus Jakarta Sans',Helvetica,sans-serif"
        font-size="18" font-weight="300"
        fill="#FFFFFF" text-anchor="middle"
        letter-spacing="6">VOYAGES</text>
</svg>
