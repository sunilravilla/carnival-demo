<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Virgin Voyages app-icon mark: brand red square + white stacked wordmark.
       Sized for PWA / iOS home screen — sits inside the 80% safe-area used by
       Android adaptive icons, so it renders well with or without masking. -->
  <rect width="512" height="512" fill="#CC0000"/>
  <g transform="translate(256 240)" text-anchor="middle"
     font-family="'Inter','Plus Jakarta Sans',Helvetica,Arial,sans-serif"
     fill="#FFFFFF">
    <text font-size="86" font-weight="900" letter-spacing="6">VIRGIN</text>
    <text y="74" font-size="44" font-weight="500" letter-spacing="14">VOYAGES</text>
  </g>
  <!-- Small underline accent in white to echo the brand wordmark divider -->
  <rect x="186" y="338" width="140" height="4" rx="2" fill="#FFFFFF" opacity="0.85"/>
</svg>
