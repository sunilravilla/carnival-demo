<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="d2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6DBDD6"/>
      <stop offset="0.7" stop-color="#A8DAE6"/>
      <stop offset="1" stop-color="#F2EEE7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="220" fill="url(#d2bg)"/>
  <!-- Bimini palm + sand + beach umbrella -->
  <ellipse cx="700" cy="225" rx="200" ry="40" fill="#E8C988"/>
  <!-- Palm -->
  <g transform="translate(140 50)">
    <path d="M 10 0 Q 0 60 -8 130" stroke="#7A5A1B" stroke-width="6" fill="none"/>
    <g fill="#3D8B5A">
      <path d="M 10 0 Q -40 -20 -65 0"/>
      <path d="M 10 0 Q 60 -25 80 0"/>
      <path d="M 10 0 Q -30 -50 -40 -75"/>
      <path d="M 10 0 Q 50 -50 65 -75"/>
    </g>
  </g>
  <!-- Beach umbrella red -->
  <g transform="translate(420 100)">
    <path d="M 0 50 Q 60 -10 120 50" fill="#CC0000"/>
    <line x1="60" y1="50" x2="60" y2="140" stroke="#0A0A0A" stroke-width="3"/>
    <line x1="60" y1="50" x2="0" y2="50" stroke="#CC0000" stroke-width="2"/>
    <line x1="60" y1="50" x2="120" y2="50" stroke="#CC0000" stroke-width="2"/>
  </g>
  <!-- Sun -->
  <circle cx="660" cy="50" r="28" fill="#FFE6B0"/>
</svg>
